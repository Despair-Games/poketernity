name: "Typecheck (TSGo aka TS7)"

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tsgo-path-filter:
    name: TSGo Typecheck path filter
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      all: ${{ steps.filter.outputs.all }}
      ts-files: ${{ steps.filter.outputs.ts-files }}
      js-files: ${{ steps.filter.outputs.js-files }}
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/lint-filters.yml
          sparse-checkout-cone-mode: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: .github/lint-filters.yml

  # Validate types with tsgo - https://github.com/microsoft/typescript-go
  tsgo-typecheck:
    name: Run Typecheck
    runs-on: ubuntu-latest
    needs: tsgo-path-filter
    if: ${{ needs.tsgo-path-filter.outputs.all == 'true' || needs.tsgo-path-filter.outputs.ts-files == 'true' || needs.tsgo-path-filter.outputs.js-files == 'true' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      
      - uses: ./.github/actions/setup-deps

      - name: Install tsgo
        run: pnpm add @typescript/native-preview

      - name: Run Typecheck (TS files)
        run: pnpm exec tsgo --noEmit
        if: ${{ !cancelled() && (needs.tsgo-path-filter.outputs.all == 'true' || needs.tsgo-path-filter.outputs.ts-files == 'true') }}

      - name: Run Typecheck (JS files)
        run: pnpm exec tsgo -p jsconfig.json
        if: ${{ !cancelled() && (needs.tsgo-path-filter.outputs.all == 'true' || needs.tsgo-path-filter.outputs.js-files == 'true') }}
