pre-commit:
  commands:
    prettier:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm prettier-lefthook {staged_files}
      priority: 1
      stage_fixed: true
      skip:
        - merge
        - rebase
    biome-lint:
      run: pnpm biome-lefthook:commit
      stage_fixed: true
      priority: 2
      skip:
        - merge
        - rebase

pre-push:
  commands:
    biome-lint:
      run: pnpm biome-lefthook:push

post-merge:
  commands:
    update-submodules:
      run: git submodule update --init --recursive
